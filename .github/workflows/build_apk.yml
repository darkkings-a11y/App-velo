name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du dépôt
        uses: actions/checkout@v4

      - name: 2. Décompression intelligente du ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Fichier ZIP détecté, extraction en cours..."
            mkdir -p temp_extract
            unzip -q *.zip -d temp_extract
            
            PUBSPEC_PATH=$(find temp_extract -name "pubspec.yaml" | head -n 1)
            if [ -n "$PUBSPEC_PATH" ]; then
              PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
              echo "Projet détecté dans : $PROJECT_DIR"
              cp -r "$PROJECT_DIR"/* ./
            else
              echo "Erreur : pubspec.yaml introuvable dans l'archive ZIP."
              exit 1
            fi
            rm -rf temp_extract
          else
            echo "Pas de ZIP détecté, utilisation des fichiers standards."
          fi

      - name: 3. Configuration de Java (requis pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: 5. Installation des dépendances
        run: flutter pub get

      - name: 6. Construction de l'APK (Release)
        run: flutter build apk --release

      - name: 7. Sauvegarde de l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-velo-release
          path: build/app/outputs/flutter-apk/app-release.apk
